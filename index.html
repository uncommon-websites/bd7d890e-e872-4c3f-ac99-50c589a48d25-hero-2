<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Additive Tectonics - Sustainable Architectural 3D Printing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-fade-in {
            opacity: 0;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-scale-in {
            opacity: 0;
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-0 { animation-delay: 0ms; }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }

        .text-balance leading-tight tracking-tight { text-wrap: balance; }
        .text-pretty leading-relaxed max-w-2xl { text-wrap: pretty; }

        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in-up, .animate-fade-in, .animate-scale-in {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body class="bg-white font-sans antialiased text-[#0F172A] selection:bg-green-100 selection:text-green-900 min-h-screen flex flex-col overflow-x-hidden">

    <!-- Navigation -->
    <header class="w-full max-w-[1440px] mx-auto px-6 py-6 md:px-10 flex justify-between items-center animate-fade-in delay-0 z-50 relative">
        <!-- Logo -->
        <a href="#" class="flex items-center gap-2 group">
            <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-[#0F172A]">
                <path d="M16 2L2 10V22L16 30L30 22V10L16 2Z" fill="currentColor"/>
                <path d="M16 13L8 17.5V26.5L16 22V13Z" fill="white"/>
            </svg>
            <span class="text-[22px] font-bold tracking-tight text-[#0F172A]">additive tectonics</span>
        </a>
        
        <!-- Links -->
        <nav class="flex items-center gap-6 text-[15px] font-medium text-[#44403c]">
            <a href="#" class="hover:text-[#0F172A] transition-colors duration-200">Expertise</a>
            <a href="#" class="hover:text-[#0F172A] transition-colors duration-200">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <main class="flex-grow flex flex-col items-center pt-20 md:pt-28 px-6 text-center relative z-10">
        
        <!-- Headline -->
        <h1 class="text-[56px] sm:text-[72px] md:text-[88px] font-[800] tracking-[-0.04em] text-[#0F172A] leading-[1.05] max-w-[900px] mx-auto text-balance animate-fade-in-up delay-100">
            Sustainable Architectural<br>Structures at Scale
        </h1>
        
        <!-- Subheadline -->
        <p class="mt-6 text-[18px] md:text-[21px] text-[#44403c] max-w-[760px] mx-auto leading-[1.5] text-pretty animate-fade-in-up delay-200">
            Empowering architects with large-scale 3D printing and advanced wood composites to create ecological, complex structural elements without traditional manufacturing constraints.
        </p>
        
        <!-- CTA Button -->
        <div class="mt-10 animate-fade-in-up delay-300">
            <a href="#" class="inline-flex items-center justify-center px-8 py-3.5 text-[16px] font-medium text-white bg-[#16a34a] rounded-lg hover:bg-[#15803d] hover:opacity-90 transition-all duration-200 active:scale-97 shadow-sm">
                View Our Projects
            </a>
        </div>

        <!-- Hero Image Mockup -->
        <div class="mt-16 md:mt-24 w-full max-w-[1000px] mx-auto relative animate-scale-in delay-400 flex justify-center px-4">
            <img 
                src="https://imolwncbqxugevwmleed.supabase.co/storage/v1/object/public/public-assets/hero-images/bd7d890e-e872-4c3f-ac99-50c589a48d25/hero-2-img-0-1790768128858.png" 
                alt="Large-scale 3D printed architectural facade using sustainable wood composites" 
                class="w-full h-auto object-contain"
            >
        </div>

    </main>

</body>
</html>
